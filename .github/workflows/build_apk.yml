name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          if [ -f "./build_setup.sh" ]; then
            chmod +x ./build_setup.sh
            ./build_setup.sh
          elif [ -f "./android_app/build_setup.sh" ]; then
            chmod +x ./android_app/build_setup.sh
            ./android_app/build_setup.sh
          fi

      - name: Build Release APK
        run: |
          if [ -d "android_app" ]; then
            cd android_app
          fi
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycrm-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
